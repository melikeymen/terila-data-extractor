name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK 25, Windows)
    # The project is maintained on Windows and the golden digest pins the exact output of the
    # maintained platform, so the build runs there too: a runner on another file system produces
    # a slightly different output and fails the digest for a reason no code change explains.
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The build downloads the Minecraft bundler and the client jar once and verifies their SHA-1,
      # so the cache only saves the download, never the verification.
      - name: Cache the Minecraft artifacts
        uses: actions/cache@v4
        with:
          path: .mc-cache
          key: mc-cache-${{ runner.os }}-26.3

      # `build` also installs the versioned git hooks; `test` runs the full pipeline and the
      # raw/both fixture, which is the part that actually verifies the output.
      - name: Build and test
        run: .\gradlew.bat build --no-daemon --stacktrace

      - name: Build the Javadoc
        run: .\gradlew.bat javadoc --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore
          retention-days: 7
