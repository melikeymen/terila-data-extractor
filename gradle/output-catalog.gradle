    entities      : 'Entity catalog, attribute table, metadata types and pose list.',
    functions     : 'Vanilla function sources; 26.3 ships none, so an annotated empty document.',
    gameplay      : 'Game rule and potion/effect catalogs.',
    item_modifiers: 'Item modifier definitions; vanilla ships none, so an annotated empty document.',
    items         : 'Item catalog, component maps, food, tools and enchantability documents.',
    loot          : 'Loot tables, the per-block loot index and a counted id + NBT wire stream.',
    misc          : 'Remaining registry kinds, variants, dialogs, and the stat/command argument/position source vocabularies.',
    packets       : 'Packet id table per connection state and direction, plus the packet payload structures.',
