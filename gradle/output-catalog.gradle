import groovy.json.JsonSlurper

/*
 * Generates OUTPUT_CATALOG.md: the English, data-driven catalog of everything a run writes into
 * build/extractor_output.
 *
 * The catalog is a checked-in document, so it is not maintained by hand. `./gradlew
 * generateOutputCatalog` rebuilds it from the last real extraction, and the versioned pre-commit
 * hook (.githooks/pre-commit, installed by `./gradlew installGitHooks`) rebuilds and stages it
 * before every commit. When there is no extraction to read, both leave the committed file alone
 * instead of writing an empty catalog over it.
 *
 * Every number, table row and file name in the document is derived from the output itself. Only the
 * folder descriptions, the format notes and the known-limits list are static text.
 */

def catalogOutputDir = file(
    project.findProperty('terila.catalog.dir')
        ?: layout.buildDirectory.dir('extractor_output').get().asFile.path
)
def catalogFile = new File(rootDir, 'OUTPUT_CATALOG.md')

// ---------------------------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------------------------

def readJson = { File file ->
    if (!file.isFile()) {
        return null
    }
    return new JsonSlurper().parse(file, 'UTF-8')
}

def asLong = { Object value -> value instanceof Number ? ((Number) value).longValue() : 0L }

def asText = { Object value -> value == null ? null : value.toString() }

def count = { Object value -> String.format(Locale.ROOT, '%,d', asLong(value)) }

def size = { long value ->
    if (value >= (1L << 30)) {
        return String.format(Locale.ROOT, '%.2f GiB', value / (double) (1L << 30))
    }
    if (value >= (1L << 20)) {
        return String.format(Locale.ROOT, '%.1f MiB', value / (double) (1L << 20))
    }
    if (value >= (1L << 10)) {
        return String.format(Locale.ROOT, '%.1f KiB', value / (double) (1L << 10))
    }
    return "${value} B"
}

/** Recursive file/size census of one directory, split by the two file kinds worth reporting. */
def census = { File directory ->
    long files = 0L
    long total = 0L
    long jsonFiles = 0L
    long nbtFiles = 0L
    if (directory?.isDirectory()) {
        directory.eachFileRecurse { File file ->
            if (file.isFile()) {
                files++
                total += file.length()
                def name = file.name.toLowerCase(Locale.ROOT)
                if (name.endsWith('.json')) {
                    jsonFiles++
                }
                if (name.endsWith('.nbt')) {
                    nbtFiles++
                }
            }
        }
    }
    return [files: files, bytes: total, json: jsonFiles, nbt: nbtFiles]
}

def mdTable = { List<String> header, List<String> align, List<List<String>> rows ->
    def builder = new StringBuilder()
    builder.append('| ').append(header.join(' | ')).append(' |\n')
    builder.append('| ').append(align.join(' | ')).append(' |\n')
    rows.each { List<String> row ->
        builder.append('| ').append(row.join(' | ')).append(' |\n')
    }
    return builder.toString()
}

def quote = { Object value -> value == null ? '—' : '`' + value.toString() + '`' }

// ---------------------------------------------------------------------------------------------
// Static text: folder descriptions, format notes, known limits
// ---------------------------------------------------------------------------------------------

