    advancements  : 'Every advancement definition; JSON catalog plus a counted id + NBT wire stream.',
    assets        : 'Client jar resource pack mirror; JSON assets, index and the binary manifest.',
    blocks        : 'Block catalog, properties, materials, sounds, shapes, the state id table, one state document per block and the block entity mapping.',
    commands      : 'Live command tree JSON, the game\'s own command report and the framed NBT tree.',
    damage_types  : 'Damage type definitions.',
